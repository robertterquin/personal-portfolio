<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Letter R with Typography -->
  <text x="100" y="115" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-size="140" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="url(#logoGradient)" filter="url(#glow)" letter-spacing="-2">R</text>
  
  <!-- Accent Line -->
  <line x1="45" y1="155" x2="155" y2="155" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Small Dot Accents -->
  <circle cx="50" cy="50" r="3.5" fill="url(#logoGradient)" opacity="0.8"/>
  <circle cx="160" cy="165" r="2.5" fill="url(#logoGradient)" opacity="0.6"/>
</svg>