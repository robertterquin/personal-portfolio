<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robert Terquin — Full-Stack &amp; Mobile Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <script>
      (function() {
        var savedTheme = localStorage.getItem('rt_theme');
        if (savedTheme === 'day') {
          document.documentElement.classList.remove('theme-night');
          document.documentElement.classList.add('theme-day');
        } else {
          document.documentElement.classList.add('theme-night');
          document.documentElement.classList.remove('theme-day');
        }
      })();
    </script>
    <style>
      ::-webkit-scrollbar, html::-webkit-scrollbar, body::-webkit-scrollbar {
        width: 4px !important;
        height: 4px !important;
      }
      ::-webkit-scrollbar-button, html::-webkit-scrollbar-button, body::-webkit-scrollbar-button {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      ::-webkit-scrollbar-track, html::-webkit-scrollbar-track, body::-webkit-scrollbar-track {
        background: transparent !important;
      }
      ::-webkit-scrollbar-track-piece, html::-webkit-scrollbar-track-piece, body::-webkit-scrollbar-track-piece {
        background: transparent !important;
      }
      ::-webkit-scrollbar-thumb, html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb {
        background: #544d44 !important;
        border-radius: 9999px !important;
      }
      ::-webkit-scrollbar-thumb:hover, html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover {
        background: #b88252 !important;
      }
      ::-webkit-scrollbar-corner, html::-webkit-scrollbar-corner, body::-webkit-scrollbar-corner {
        background: transparent !important;
      }
      html.theme-day ::-webkit-scrollbar-thumb, html.theme-day::-webkit-scrollbar-thumb, html.theme-day body::-webkit-scrollbar-thumb {
        background: #c2b7a9 !important;
      }
      html.theme-day ::-webkit-scrollbar-thumb:hover, html.theme-day::-webkit-scrollbar-thumb:hover, html.theme-day body::-webkit-scrollbar-thumb:hover {
        background: #8e582e !important;
      }
      @supports not selector(::-webkit-scrollbar) {
        * { scrollbar-width: thin; scrollbar-color: #544d44 transparent; }
        html.theme-day * { scrollbar-color: #c2b7a9 transparent; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
