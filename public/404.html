<!doctype html>
<html lang="en" class="theme-night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#12100e" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found — Robert Terquin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">

    <script>
      (function() {
        if (localStorage.getItem('rt_theme') === 'day') {
          document.documentElement.classList.replace('theme-night', 'theme-day');
        }
      })();
    </script>

    <style>
      :root {
        --bg: #070606;
        --ink: #f7f5f2;
        --ink-muted: #aca59c;
        --ink-dim: #7a7369;
        --line: rgba(206, 191, 171, 0.07);
        --accent: #b88252;
        --accent-hover: #cb9767;
      }

      html.theme-day {
        --bg: #f4f0e8;
        --ink: #161311;
        --ink-muted: #5e564d;
        --ink-dim: #857d72;
        --line: #e4dcd0;
        --accent: #8e582e;
        --accent-hover: #71421e;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        max-width: 1360px;
        margin: 0 auto;
        padding: 0 36px;
      }

      header {
        height: 80px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--line);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      header a { color: var(--ink); text-decoration: none; }
      header a:hover { color: var(--accent); }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px 0;
      }

      .code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem;
        color: var(--ink-dim);
        letter-spacing: 0.08em;
        margin: 0 0 16px;
      }

      h1 {
        margin: 0 0 18px;
        font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: clamp(2.5rem, 8vw, 4.6rem);
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.035em;
        color: var(--accent);
      }

      p.lead {
        margin: 0 0 32px;
        max-width: 460px;
        font-size: 1rem;
        line-height: 1.7;
        color: var(--ink-muted);
      }

      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.86rem;
        color: var(--ink);
        text-decoration: none;
        transition: color 0.15s ease;
      }

      .home-link:hover { color: var(--accent); }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      footer {
        padding: 28px 0 40px;
        border-top: 1px solid var(--line);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.74rem;
        color: var(--ink-dim);
      }

      @media (max-width: 540px) {
        body { padding: 0 16px; }
        header { height: 64px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">Robert Terquin</a>
    </header>

    <main>
      <p class="code">404</p>
      <h1>Page not found.</h1>
      <p class="lead">The page you're looking for doesn't exist or has moved.</p>
      <a href="/" class="home-link">← Back to home</a>
    </main>

    <footer>© Robert Terquin Laqui · Philippines</footer>
  </body>
</html>
